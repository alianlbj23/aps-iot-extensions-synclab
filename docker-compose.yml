services:
  web:
    build:
      context: ./web/src          # ← 相對於 compose 檔
      dockerfile: Dockerfile
    image: aps-iot-web
    container_name: synlab_web
    volumes:
      - synlab_web_data:/usr/src/app/data  # ← 用 /data的資料夾來存放資料，避免 container 資料覆蓋
    ports:
      - "${PORT:-3000}:3000"
    env_file:                   # ← 這裡用 env_file，而不是 environment: - .env
      - .env
    restart: unless-stopped # ← 除非手動停止，否則異常停止會自動重啟 適合 server 類型的服務

  rtsp:
    image: bluenviron/mediamtx:latest
    container_name: synlab-rtsp
    ports:
      - "8554:8554"
      - "1935:1935"
      - "8888:8888"
    # volumes:
      # - ./rtsp/mediamtx.yml:/mediamtx.yml:ro

volumes:
  synlab_web_data: {}

